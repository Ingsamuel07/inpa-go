    startCommand: npm --workspace @inpago/import-service start
    envVars:
      - key: IMPORT_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
